<!DOCTYPE html>

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#333;
    line-height:1.6;
    text-align:start;
}
body[lang="ar"],body[lang="ur"]{
    font-family:'Noto Kufi Arabic','Noto Naskh Arabic','Scheherazade New',sans-serif;
}

/* RTL/LTR */
[dir='rtl']{text-align:right;}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#007bff;
    color:#fff;
}
.language-selector,.lock-icon{
    padding:5px 10px;
    background:#f0ad4e;
    border:none;
    color:white;
    font-weight:bold;
    border-radius:3px;
    cursor:pointer;
}
.lock-icon{font-size:1.2em;}
.main-content{padding:20px;}
.dashboard-section{
    background:#fff;
    border:1px solid #ddd;
    border-radius:5px;
    padding:15px;
    margin-bottom:15px;
}
h2{
    color:#0056b3;
    margin-bottom:10px;
    border-bottom:2px solid #eee;
    padding-bottom:5px;
}
.support-button{
    display:block;
    width:200px;
    margin:20px auto;
    padding:10px;
    background:#28a745;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:5px;
}
.admin-panel{
    display:none;
    background:#e9e9e9;
    border:1px solid #ccc;
    padding:20px;
    margin-top:20px;
    border-radius:5px;
}
.admin-panel.active{display:block;}
.user-list li{
    margin-bottom:5px;
    padding:5px;
    background:#f9f9f9;
    border:1px solid #eee;
    border-radius:3px;
}
input[type="password"]{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:4px;
}
button{
    padding:10px 15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}
button:hover{background:#0056b3;}
</style>
</head>

<body>
<div class="header">
    <div class="lock-icon" id="adminLock">🔒</div>
    <h1 class="logo" data-i18n="system_name"></h1>
    <select id="languageSelector" class="language-selector">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="ur">اردو</option>
    </select>
</div>

<div class="main-content">
    <div id="publicInterface">
        <div id="dashboardContainer">
            <h2 data-i18n="welcome_message"></h2>
            <p data-i18n="dashboard_description"></p>

            <div class="dashboard-section" id="ownerDashboard" style="display:none;">
                <h2 data-i18n="owner_dashboard_title"></h2>
                <ul>
                    <li data-i18n="kpis"></li>
                    <li data-i18n="zone_heatmaps"></li>
                    <li data-i18n="credit_risk"></li>
                    <li data-i18n="cashflow"></li>
                    <li data-i18n="profitability"></li>
                    <li data-i18n="supplier_roi"></li>

            </div>

            <div class="dashboard-section" id="adminDashboard" style="display:none;">

                <ul>
                    <li data-i18n="control_tower"></li>
                    <li data-i18n="bank_transfer_ocr_queue"></li>
                    <li data-i18n="offer_scheduler"></li>
                    <li data-i18n="driver_management"></li>
                    <li data-i18n="exception_handling"></li>
                </ul>
            </div>
        </div>

        <a href="#" class="support-button" data-i18n="support_button"></a>
        <p class="support-number" data-i18n="support_number_label"></p>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h2 data-i18n="admin_panel_title"></h2>
        <p data-i18n="admin_login_required"></p>
        <form id="adminLoginForm">

            <input type="password" id="adminCode" required>
            <label data-i18n="admin_password_label"></label>
            <input type="password" id="adminPassword" required>
            <button type="submit" data-i18n="login_button"></button>

let currentLanguage = localStorage.getItem('currentLanguage') || 'en';

function setLanguage(lang) {
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr');

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = translations[lang][key] || translations['en'][key] || key;
    });

    currentLanguage = lang;
    localStorage.setItem('currentLanguage', lang);
}

adminLoginForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const code = document.getElementById('adminCode').value;
    const password = document.getElementById('adminPassword').value;

    if (code === "1405" && password === "1405") {
        adminLoginError.style.display = "none";
        adminContent.style.display = "block";
        loadUserAccounts();
    } else {
        adminLoginError.style.display = "block";
    }
});

function loadUserAccounts() {
    userList.innerHTML = "";
    userAccounts.forEach(acc => {
        const li = document.createElement('li');
        li.textContent = `${acc.role} — ${acc.access}`;
        userList.appendChild(li);
    });
}

    const dashboards = document.querySelectorAll('.dashboard-section');
    dashboards.forEach(d => d.style.display = 'none');

    if (role === "Owner") {
        document.getElementById('ownerDashboard').style.display = 'block';
        document.getElementById('adminDashboard').style.display = 'block';
    }

    if (role === "Fleet Captain") {
        loadFleetCaptainDashboard();
    }

    if (role === "IU Assistant") {
        setLanguage('en');
        loadIUAssistantDashboard();
    }
}

function loadFleetCaptainDashboard() {
    const container = document.getElementById('dashboardContainer');
    container.innerHTML = `
        <h2 data-i18n="fleet_captain_dashboard_title">${translations[currentLanguage].fleet_captain_dashboard_title}</h2>

            <li data-i18n="zone_management">${translations[currentLanguage].zone_management}</li>
        </ul>

        <h3>${translations[currentLanguage].live_tracking_updates}</h3>
        <div id="liveTrackingOutput" style="border:1px solid #ccc;padding:10px;max-height:150px;overflow-y:auto;background:#f9f9f9;"></div>
    `;

    startTrackingUpdates();
}

function loadIUAssistantDashboard() {
    const container = document.getElementById('dashboardContainer');
    container.innerHTML = `
        <h2>${translations.en.iu_assistant_dashboard_title}</h2>
        <p>${translations.en.read_only_access}</p>
        <ul>
            <li>${translations.en.products}</li>

            <li>${translations.en.drivers}</li>
            <li>${translations.en.zones}</li>
            <li>${translations.en.tracking}</li>
        </ul>

        <h3>${translations.en.live_tracking_updates}</h3>
        <div id="liveTrackingOutput" style="border:1px solid #ccc;padding:10px;max-height:150px;overflow-y:auto;background:#f9f9f9;"></div>
    `;

    startTrackingUpdates();
}

function startTrackingUpdates() {
    stopTrackingUpdates();

    const trackingOutput = document.getElementById('liveTrackingOutput');
    if (!trackingOutput) return;

    let driverLat = 24.7136;
    let driverLng = 46.6753;
    let driverId = 101;
    let statuses = ["En Route", "At Destination", "Delivered", "Delayed"];

    trackingIntervalId = setInterval(() => {
        driverLat += (Math.random() - 0.5) * 0.01;
        driverLng += (Math.random() - 0.5) * 0.01;
        const status = statuses[Math.floor(Math.random() * statuses.length)];

        let text = translations[currentLanguage].tracking_status
            .replace("{driverId}", driverId)
            .replace("{lat}", driverLat.toFixed(4))
            .replace("{lng}", driverLng.toFixed(4))
            .replace("{status}", status);

        const p = document.createElement('p');
        p.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        trackingOutput.prepend(p);

        if (trackingOutput.children.length > 5) {
            trackingOutput.removeChild(trackingOutput.lastChild);
        }
    }, 3000);
}

function stopTrackingUpdates() {
    if (trackingIntervalId) {
        clearInterval(trackingIntervalId);
        trackingIntervalId = null;
    }
}


// =========================

// =========================

setLanguage(currentLanguage);

// محاكاة استثناءات تشغيلية
const exceptionsQueue = [];

function raiseOperationalException(type, details) {
    const ex = {
        id: exceptionsQueue.length + 1,
        type,
        details,
        time: new Date().toLocaleString()
    };
    exceptionsQueue.push(ex);
    console.warn(`[EXCEPTION] ${type}: ${details}`);
}

        otp: Math.floor(100000 + Math.random() * 900000),
        status: "Captured"
    };
}
