<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app_title"></title>

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#333;
    line-height:1.6;
    text-align:start;
}
body[lang="ar"],body[lang="ur"]{
    font-family:'Noto Kufi Arabic','Noto Naskh Arabic','Scheherazade New',sans-serif;
}

/* RTL/LTR */
[dir='rtl']{text-align:right;}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#007bff;
    color:#fff;
}
.language-selector,.lock-icon{
    padding:5px 10px;
    background:#f0ad4e;
    border:none;
    color:white;
    font-weight:bold;
    border-radius:3px;
    cursor:pointer;
}
.lock-icon{font-size:1.2em;}
.main-content{padding:20px;}
.dashboard-section{
    background:#fff;
    border:1px solid #ddd;
    border-radius:5px;
    padding:15px;
    margin-bottom:15px;
}
h2{
    color:#0056b3;
    margin-bottom:10px;
    border-bottom:2px solid #eee;
    padding-bottom:5px;
}
.support-button{
    display:block;
    width:200px;
    margin:20px auto;
    padding:10px;
    background:#28a745;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:5px;
}
.admin-panel{
    display:none;
    background:#e9e9e9;
    border:1px solid #ccc;
    padding:20px;
    margin-top:20px;
    border-radius:5px;
}
.admin-panel.active{display:block;}
.user-list li{
    margin-bottom:5px;
    padding:5px;
    background:#f9f9f9;
    border:1px solid #eee;
    border-radius:3px;
}
input[type="password"]{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:4px;
}
button{
    padding:10px 15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}
button:hover{background:#0056b3;}
</style>
</head>

<body>
<div class="header">
    <div class="lock-icon" id="adminLock">🔒</div>
    <h1 class="logo" data-i18n="system_name"></h1>
    <select id="languageSelector" class="language-selector">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="ur">اردو</option>
    </select>
</div>

<div class="main-content">
    <div id="publicInterface">
        <div id="dashboardContainer">
            <h2 data-i18n="welcome_message"></h2>
            <p data-i18n="dashboard_description"></p>

            <div class="dashboard-section" id="ownerDashboard" style="display:none;">
                <h2 data-i18n="owner_dashboard_title"></h2>
                <ul>
                    <li data-i18n="kpis"></li>
                    <li data-i18n="zone_heatmaps"></li>
                    <li data-i18n="credit_risk"></li>
                    <li data-i18n="cashflow"></li>
                    <li data-i18n="profitability"></li>
                    <li data-i18n="supplier_roi"></li>
                </ul>
            </div>

            <div class="dashboard-section" id="adminDashboard" style="display:none;">
                <h2 data-i18n="admin_dashboard_title"></h2>
                <ul>
                    <li data-i18n="control_tower"></li>
                    <li data-i18n="bank_transfer_ocr_queue"></li>
                    <li data-i18n="offer_scheduler"></li>
                    <li data-i18n="driver_management"></li>
                    <li data-i18n="exception_handling"></li>
                </ul>
            </div>
        </div>

        <a href="#" class="support-button" data-i18n="support_button"></a>
        <p class="support-number" data-i18n="support_number_label"></p>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h2 data-i18n="admin_panel_title"></h2>
        <p data-i18n="admin_login_required"></p>
        <form id="adminLoginForm">
            <label data-i18n="admin_code_label"></label>
            <input type="password" id="adminCode" required>
            <label data-i18n="admin_password_label"></label>
            <input type="password" id="adminPassword" required>
            <button type="submit" data-i18n="login_button"></button>
            <p id="adminLoginError" style="color:red;display:none;" data-i18n="admin_login_error"></p>
        </form>

        <div id="adminContent" style="display:none;">
            <h3 data-i18n="all_accounts"></h3>
            <ul id="userList" class="user-list"></ul>
            <h3 data-i18n="sensitive_settings"></h3>
            <p data-i18n="setting_example"></p>
        </div>
    </div>
</div>
