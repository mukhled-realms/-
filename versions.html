<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TurboWash Mobile — 4 تصاميم في رابط واحد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- ============================================================
     أنماط مشتركة (تُستخدم في كل التصاميم)
     ============================================================ -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Tajawal',system-ui,sans-serif;
  min-height:100vh;line-height:1.7;overflow-x:hidden;color:#0E1B2C;
}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;outline:none;border:none}
input,select,textarea{color:inherit}

/* الأزرار الموحدة */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.22s;border:1.5px solid transparent;text-align:center}
.btn:active{transform:scale(.97)}
.btn-block{width:100%}
.btn-sm{padding:9px 15px;font-size:13px;border-radius:11px}
.btn-primary{background:linear-gradient(135deg,#1E6FD9,#0B3D91);color:#fff;box-shadow:0 10px 22px rgba(30,111,217,.3)}
.btn-primary:hover{box-shadow:0 14px 30px rgba(30,111,217,.42)}
.btn-green{background:linear-gradient(135deg,#1FB574,#12855A);color:#fff;box-shadow:0 10px 22px rgba(18,133,90,.3)}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 10px 22px rgba(18,140,126,.3)}
.btn-ghost{background:#fff;color:#0A2540;border-color:#DCE6F2}
.btn-ghost:hover{border-color:#1E6FD9;color:#1E6FD9}
.btn-orange{background:linear-gradient(135deg,#F97316,#C2410C);color:#fff;box-shadow:0 10px 22px rgba(249,115,22,.3)}

/* الحقول الموحدة */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field label .req{color:#E03131}
.field input,.field select,.field textarea{
  width:100%;padding:12px 15px;border:1.5px solid #DCE6F2;border-radius:12px;
  background:#FBFDFF;transition:.2s;font-size:14.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:#1E6FD9;background:#fff;box-shadow:0 0 0 4px rgba(30,111,217,.12);
}
.field textarea{resize:vertical;min-height:90px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* التنبيهات */
#toasts{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:92vw}
.toast{background:#0A2540;color:#fff;padding:11px 22px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:0 12px 30px rgba(10,37,64,.35);animation:tIn .3s ease;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.ok{background:linear-gradient(135deg,#1FB574,#12855A)}
.toast.err{background:linear-gradient(135deg,#F97316,#C2410C)}
@keyframes tIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ============================================================
   زر التبديل بين التصاميم (عائم في كل الصفحات)
   ============================================================ */
#versionSwitcher{
  position:fixed;top:14px;right:14px;z-index:9998;
  background:rgba(255,255,255,.98);backdrop-filter:blur(20px);
  border-radius:999px;padding:6px;box-shadow:0 14px 40px rgba(10,37,64,.25);
  display:flex;align-items:center;gap:4px;border:1px solid rgba(10,37,64,.08);
  transition:.3s;
}
#versionSwitcher:hover{transform:scale(1.02)}
#versionSwitcher .v-label{
  font-size:11px;font-weight:900;color:#5B6B80;padding:0 8px;letter-spacing:.5px;
}
#versionSwitcher .v-num{
  background:#0A2540;color:#fff;font-weight:900;font-size:12px;
  min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 6px 14px rgba(10,37,64,.3);
}
#versionSwitcher button{
  width:34px;height:34px;border-radius:50%;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:#0A2540;transition:.22s;
}
#versionSwitcher button:hover{background:#E8F1FC;color:#1E6FD9}
#versionSwitcher .v-dot{
  width:8px;height:8px;border-radius:50%;background:#1E6FD9;transition:.3s;
}
#versionSwitcher.v2 .v-dot{background:#D4AF37}
#versionSwitcher.v3 .v-dot{background:#06B6D4}
#versionSwitcher.v4 .v-dot{background:#F97316}
#versionSwitcher.v2 .v-num{background:linear-gradient(135deg,#0B3D91,#D4AF37)}
#versionSwitcher.v3 .v-num{background:linear-gradient(135deg,#06B6D4,#8B5CF6)}
#versionSwitcher.v4 .v-num{background:linear-gradient(135deg,#F97316,#C2410C)}

/* إشعار التصميم الحالي */
#vIndicator{
  position:fixed;top:14px;left:14px;z-index:9997;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  padding:8px 14px;border-radius:999px;font-size:11.5px;font-weight:900;
  box-shadow:0 8px 22px rgba(10,37,64,.15);border:1px solid rgba(10,37,64,.06);
  display:flex;align-items:center;gap:7px;color:#0A2540;
}
#vIndicator .ic{font-size:14px}

/* ============================================================
   التصميم 1: التطبيقي (App Style)
   ============================================================ */
.v1-root{
  background:linear-gradient(135deg,#0A2540 0%,#061729 100%);
  min-height:100vh;display:flex;justify-content:center;align-items:center;padding:0;
}
.v1-phone{
  width:100%;max-width:430px;height:100vh;max-height:920px;
  background:#F4F7FC;border-radius:0;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 40px 100px rgba(0,0,0,.55);
  position:relative;
}
@media(min-width:520px){
  .v1-phone{border-radius:38px;height:92vh;border:10px solid #0A1A2F}
}
.v1-header{
  background:linear-gradient(135deg,#0A2540,#0B3D91 70%,#1E6FD9 120%);
  color:#fff;padding:16px 18px 14px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;overflow:hidden;flex-shrink:0;
}
.v1-header::after{
  content:"";position:absolute;left:-40px;top:-60px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.25),transparent 70%);
}
.v1-brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.v1-brand .lg{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,#1E6FD9,#12855A);
  display:grid;place-items:center;font-weight:900;font-size:18px;
}
.v1-brand b{font-size:16px;font-weight:900;line-height:1.1}
.v1-brand span{display:block;font-size:10px;letter-spacing:1.5px;opacity:.85}
.v1-h-actions{display:flex;gap:6px;position:relative;z-index:1}
.v1-h-btn{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;
  cursor:pointer;color:#fff;transition:.2s;backdrop-filter:blur(8px);
}
.v1-h-btn:hover{background:rgba(255,255,255,.28)}
.v1-loc-bar{
  background:#fff;padding:8px 18px;display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:#5B6B80;border-bottom:1px solid #DCE6F2;flex-shrink:0;
}
.v1-loc-bar .pulse{width:8px;height:8px;border-radius:50%;background:#1FB574;box-shadow:0 0 0 4px rgba(31,181,116,.18);animation:v1pulse 2s infinite}
@keyframes v1pulse{0%,100%{opacity:1}50%{opacity:.4}}
.v1-screen{flex:1;overflow-y:auto;padding-bottom:90px}
.v1-page{display:none;padding:18px 18px 20px;animation:v1fade .35s ease}
.v1-page.active{display:block}
@keyframes v1fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.v1-hero{
  position:relative;border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,#0B3D91 0%,#0A2540 100%);
  color:#fff;padding:22px 20px 26px;margin-bottom:16px;box-shadow:0 12px 30px rgba(10,37,64,.12);
}
.v1-hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 100% at 90% 0%,rgba(30,111,217,.6),transparent 55%);
}
.v1-hero .c{position:relative;z-index:2}
.v1-hero h2{font-size:21px;font-weight:900;line-height:1.35}
.v1-hero h2 em{font-style:normal;color:#8CF0C0}
.v1-hero p{font-size:13.5px;opacity:.85;margin-top:8px;max-width:280px}
.v1-badges{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.v1-badge{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;backdrop-filter:blur(6px)}
.v1-sec-title{font-size:17px;font-weight:900;color:#0A2540;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between}
.v1-sec-title:first-child{margin-top:0}
.v1-sec-title a{font-size:12.5px;color:#1E6FD9;font-weight:700}
.v1-svc-list{display:flex;flex-direction:column;gap:11px}
.v1-svc{background:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(10,37,64,.06);border:1px solid #DCE6F2;cursor:pointer;transition:.25s}
.v1-svc:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(10,37,64,.12);border-color:#C6DBF5}
.v1-svc .icon-box{width:52px;height:52px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#E8F1FC,#D6E7FB)}
.v1-svc .info{flex:1;min-width:0}
.v1-svc .info b{display:block;font-size:15px;font-weight:900;color:#0A2540}
.v1-svc .info span{font-size:12px;color:#5B6B80}
.v1-svc .price-tag{font-size:17px;font-weight:900;color:#1E6FD9;display:flex;align-items:baseline;gap:3px;flex-shrink:0}
.v1-svc .price-tag small{font-size:11px;font-weight:500;color:#5B6B80}
.v1-offer{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0B3D91,#0A2540);position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(10,37,64,.12);margin-bottom:11px}
.v1-offer.green{background:linear-gradient(135deg,#12855A,#0A2540)}
.v1-offer::before{content:"";position:absolute;top:-40px;left:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.3),transparent 70%)}
.v1-offer h4{font-size:16px;font-weight:900;position:relative}
.v1-offer .prices{display:flex;align-items:baseline;gap:10px;margin-top:10px;position:relative}
.v1-offer .old{text-decoration:line-through;opacity:.55;font-size:15px}
.v1-offer .new{font-size:26px;font-weight:900;color:#8CF0C0}
.v1-bottom-nav{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
  border-top:1px solid #DCE6F2;display:flex;justify-content:space-around;
  align-items:center;padding:8px 6px 12px;z-index:50;
}
.v1-bnav{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:6px 4px;border-radius:12px;cursor:pointer;transition:.2s;color:#5B6B80;background:none;font-size:10.5px;font-weight:700}
.v1-bnav .bico{font-size:19px;line-height:1}
.v1-bnav.active{color:#1E6FD9}
.v1-bnav:hover{background:#E8F1FC}
.v1-form-card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(10,37,64,.12);border:1px solid #DCE6F2}
.v1-pay-methods{display:flex;gap:8px;margin:6px 0 14px}
.v1-pay{flex:1;background:#fff;border:1.5px solid #DCE6F2;border-radius:10px;padding:10px 6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0A2540;transition:.2s;cursor:pointer}
.v1-pay.active{border-color:#1E6FD9;background:#E8F1FC;box-shadow:0 0 0 3px rgba(30,111,217,.1)}
.v1-order-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(10,37,64,.07);border:1px solid #DCE6F2;position:relative;overflow:hidden}
.v1-order-card::before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px}
.v1-order-card.paid::before{background:#F59E0B}
.v1-order-card.washing::before{background:#1E6FD9}
.v1-order-card.done::before{background:#1FB574}
.v1-order-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.v1-status-pill{font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px}
.v1-status-pill.paid{background:#FEF3C7;color:#B45309}
.v1-status-pill.washing{background:#DBEAFE;color:#1D4ED8}
.v1-status-pill.done{background:#D1FAE5;color:#0B5C3E}
.v1-map-box{border-radius:16px;overflow:hidden;height:220px;margin-bottom:16px;box-shadow:0 12px 30px rgba(10,37,64,.12);border:1px solid #DCE6F2;position:relative}

/* ============================================================
   التصميم 2: الفخم الوطني (Luxury)
   ============================================================ */
.v2-root{background:#F4F7FC;min-height:100vh;font-family:'Tajawal',sans-serif}
.v2-topbar{background:linear-gradient(90deg,#0A2540,#0B3D91 55%,#12855A 130%);color:#fff;font-size:13.5px}
.v2-topbar .wrap{width:min(1180px,92%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;flex-wrap:wrap}
.v2-topbar .tb{display:flex;align-items:center;gap:7px;opacity:.95}
.v2-topbar .dot{width:7px;height:7px;border-radius:50%;background:#1FB574;box-shadow:0 0 0 4px rgba(31,181,116,.22)}
.v2-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid #DCE6F2}
.v2-nav{width:min(1180px,92%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0}
.v2-brand{display:flex;align-items:center;gap:12px}
.v2-brand svg{width:46px;height:46px}
.v2-brand-text b{display:block;font-weight:900;font-size:19px;color:#0A2540;line-height:1.2}
.v2-brand-text span{display:block;font-size:11.5px;color:#5B6B80;letter-spacing:1.4px}
.v2-menu{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.v2-menu a{padding:8px 14px;border-radius:999px;font-weight:500;font-size:14.5px;color:#28405c;transition:.22s}
.v2-menu a:hover,.v2-menu a.active{background:#0A2540;color:#fff}
.v2-actions{display:flex;gap:8px}
.v2-hero{
  position:relative;overflow:hidden;color:#fff;padding:64px 0 150px;
  background:radial-gradient(130% 130% at 82% 0%,#1A5BB5 0%,#0B3D91 35%,#0A2540 70%,#061729 100%);
}
.v2-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:26px 26px;opacity:.55}
.v2-skyline{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:270px;z-index:1;pointer-events:none}
.v2-hero .wrap{position:relative;z-index:3;width:min(1180px,92%);margin:auto}
.v2-hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.v2-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 15px;border-radius:999px;font-size:13px;margin-bottom:18px;backdrop-filter:blur(8px)}
.v2-eyebrow .star{color:#D4AF37}
.v2-hero h1{font-size:clamp(30px,4.6vw,52px);font-weight:900;line-height:1.25}
.v2-hero h1 em{font-style:normal;background:linear-gradient(90deg,#6FE3B0,#1FB574);-webkit-background-clip:text;background-clip:text;color:transparent}
.v2-hero p.lead{margin-top:16px;font-size:17px;color:rgba(255,255,255,.82);max-width:560px}
.v2-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.v2-stats{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.v2-stats .st b{display:block;font-size:26px;font-weight:900;color:#fff}
.v2-stats .st span{font-size:13px;color:rgba(255,255,255,.66)}
.v2-block{padding:70px 0}
.v2-wrap{width:min(1180px,92%);margin:auto}
.v2-sec-head{text-align:center;max-width:660px;margin:0 auto 44px}
.v2-tag{display:inline-block;background:#E8F1FC;color:#0B3D91;font-size:12.5px;font-weight:700;letter-spacing:1px;padding:5px 14px;border-radius:999px;margin-bottom:14px}
.v2-sec-head h2{font-size:clamp(24px,3.4vw,36px);font-weight:900;color:#0A2540;line-height:1.35}
.v2-sec-head p{color:#5B6B80;margin-top:10px;font-size:15.5px}
.v2-grid{display:grid;gap:22px}
.v2-g4{grid-template-columns:repeat(4,1fr)}
.v2-g3{grid-template-columns:repeat(3,1fr)}
.v2-g2{grid-template-columns:repeat(2,1fr)}
.v2-card{background:#fff;border:1px solid #DCE6F2;border-radius:18px;padding:26px;box-shadow:0 18px 40px rgba(10,37,64,.12);transition:.28s;position:relative}
.v2-card:hover{transform:translateY(-6px);box-shadow:0 30px 70px rgba(10,37,64,.22)}
.v2-card .ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#E8F1FC,#D6E7FB);font-size:24px;margin-bottom:16px}
.v2-card h3{font-size:18px;font-weight:900;color:#0A2540;margin-bottom:6px}
.v2-card p{color:#5B6B80;font-size:14.5px}
.v2-price{font-size:30px;font-weight:900;color:#0B3D91;margin-top:14px;display:flex;align-items:baseline;gap:6px}
.v2-price small{font-size:14px;font-weight:500;color:#5B6B80}
.v2-offer{border-radius:22px;padding:30px;color:#fff;background:linear-gradient(135deg,#0B3D91,#0A2540);position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(10,37,64,.22)}
.v2-offer.green{background:linear-gradient(135deg,#12855A,#0A2540)}
.v2-offer h3{font-size:22px;font-weight:900;position:relative}
.v2-offer p{color:rgba(255,255,255,.78);margin-top:8px;font-size:14.5px;position:relative}
.v2-offer .prices{display:flex;align-items:baseline;gap:12px;margin-top:18px;position:relative}
.v2-offer .old{text-decoration:line-through;color:rgba(255,255,255,.5);font-size:18px}
.v2-offer .new{font-size:38px;font-weight:900;color:#8CF0C0}
.v2-footer{background:linear-gradient(180deg,#0A2540,#061729);color:rgba(255,255,255,.75);padding:56px 0 26px}
.v2-foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
.v2-footer h4{color:#fff;font-size:16px;font-weight:900;margin-bottom:14px}
.v2-footer a{display:block;padding:4px 0;font-size:14px;transition:.2s}
.v2-footer a:hover{color:#8CF0C0}

/* ============================================================
   التصميم 3: العصري الداكن (Dark Neon)
   ============================================================ */
.v3-root{
  background:#050810;min-height:100vh;color:#E2E8F0;
  position:relative;overflow-x:hidden;
}
.v3-root::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(50% 40% at 15% 20%,rgba(6,182,212,.18),transparent 60%),
    radial-gradient(50% 40% at 85% 80%,rgba(139,92,246,.18),transparent 60%);
}
.v3-ticker{
  position:relative;z-index:2;
  background:linear-gradient(90deg,#06B6D4,#8B5CF6,#06B6D4);
  background-size:200% 100%;
  color:#fff;font-weight:700;font-size:13.5px;padding:9px 0;overflow:hidden;
  animation:v3slide 6s linear infinite;
}
@keyframes v3slide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.v3-ticker-inner{display:flex;gap:60px;white-space:nowrap;animation:v3scroll 25s linear infinite;padding-left:100%}
@keyframes v3scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.v3-ticker span{display:inline-flex;align-items:center;gap:8px}
.v3-header{
  position:sticky;top:0;z-index:60;
  background:rgba(5,8,16,.92);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(6,182,212,.2);
  position:relative;z-index:2;
}

}

function shade(hex, pct){
  let n = hex.replace('#','');
  if(n.length === 3) n = n.split('').map(c=>c+c).join('');
  let r = parseInt(n.slice(0,2),16), g = parseInt(n.slice(2,4),16), b = parseInt(n.slice(4,6),16);
  const f = pct/100;
  r = Math.max(0, Math.min(255, Math.round(r + 255*f)));
  g = Math.max(0, Math.min(255, Math.round(g + 255*f)));
  b = Math.max(0, Math.min(255, Math.round(b + 255*f)));
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}

/* ================================================================
   مُشغِّل التصاميم (Switcher)
   ================================================================ */
function renderVersion(){
  const v = state.version;
  const root = $('#appRoot');
  const switcher = $('#versionSwitcher');
  switcher.className = 'v' + v;
  $('#vNum').textContent = v;
  $('#vCurrent').textContent = v;
  const ind = $('#vIndicator');
  const icons = { 1:'📱', 2:'✨', 3:'🌙', 4:'🔥' };
  const names = { 1:'التطبيقي', 2:'الفخم', 3:'العصري', 4:'الإعلاني' };
  ind.querySelector('.ic').textContent = icons[v];
  ind.querySelector('span:last-child').innerHTML = `التصميم <span id="vCurrent">${v}</span> من 4 · ${names[v]}`;

  if(v === 1) root.innerHTML = renderV1(), initV1();
  else if(v === 2) root.innerHTML = renderV2(), initV2();
  else if(v === 3) root.innerHTML = renderV3(), initV3();
  else if(v === 4) root.innerHTML = renderV4(), initV4();
}

function goV(n){
  state.version = n;
  save.version();
  renderVersion();
  window.scrollTo(0,0);
}

$('#vNext').addEventListener('click', () => goV(state.version === 4 ? 1 : state.version + 1));
$('#vPrev').addEventListener('click', () => goV(state.version === 1 ? 4 : state.version - 1));

/* ================================================================
   تفعيل كل تصميم
   ================================================================ */
function initV1(){
  // التنقل بين الصفحات الداخلية
  const go = (p) => {
    $$('[data-v1-page]').forEach(x => x.classList.toggle('active', x.dataset.v1Page === p));
    $$('.v1-bnav').forEach(b => b.classList.toggle('active', b.dataset.v1Go === p));
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-v1-go]');
    if(b){ go(b.dataset.v1Go); }
  });
  // خريطة
  setTimeout(() => {
    try{
      const m = L.map('v1-map', { zoomControl:false, attributionControl:false }).setView([24.7136,46.6753],11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
      L.circle([24.7136,46.6753], { radius:9000, color:'#1E6FD9', fillColor:'#1E6FD9', fillOpacity:.12, weight:2 }).addTo(m);
    }catch(e){}
  }, 150);
}

function initV2(){
  const go = (p) => {
    const c = $('[data-v2-content]');
    c.innerHTML = p === 'home' ? v2Home() : p === 'booking' ? v2Booking() : p === 'orders' ? v2Orders() : p === 'bikes' ? v2Bikes() : p === 'contact' ? v2Contact() : v2Rating();
    $$('.v2-menu a').forEach(a => a.classList.toggle('active', a.dataset.v2Go === p));
    window.scrollTo(0,0);
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-v2-go]');
    if(b){ e.preventDefault(); go(b.dataset.v2Go); }
  });
  go('home');
}

function initV3(){
  const go = (p) => {
    const c = $('[data-v3-content]');
    c.innerHTML = p === 'home' ? v3Home() : p === 'booking' ? v3Booking() : p === 'orders' ? v3Orders() : p === 'bikes' ? v3Bikes() : v3Contact();
    $$('.v3-menu a').forEach(a => a.classList.toggle('active', a.dataset.v3Go === p));
    window.scrollTo(0,0);
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-v3-go]');
    if(b){ e.preventDefault(); go(b.dataset.v3Go); }

function initV4(){
  const go = (p) => {
    const c = $('[data-v4-content]');
    c.innerHTML = p === 'home' ? v4Home() : p === 'booking' ? v4Booking() : p === 'orders' ? v4Orders() : p === 'bikes' ? v4Bikes() : v4Contact();
    $$('.v4-menu a').forEach(a => a.classList.toggle('active', a.dataset.v4Go === p));
    window.scrollTo(0,0);
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-v4-go]');
    if(b){ e.preventDefault(); go(b.dataset.v4Go); }
  });
  go('home');

  // العد التنازلي
  clearInterval(window._v4timer);
  window._v4timer = setInterval(() => {
    const el = $('#v4Countdown');
    if(!el){ clearInterval(window._v4timer); return; }
    const diff = Math.max(0, state.countdownEnd - Date.now());
    const h = String(Math.floor(diff / 3600000)).padStart(2,'0');
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  }, 1000);
}

/* ================================================================
   الأحداث المشتركة (تعمل في كل التصاميم)
   ================================================================ */
document.addEventListener('click', e => {
  // خدمة
  const svc = e.target.closest('[data-service]');
  if(svc){
    sessionStorage.setItem('tw_preselect', svc.dataset.service);
    toast('تم اختيار الخدمة ✅', 'ok');
    // انتقل لصفحة الحجز حسب التصميم الحالي
    const v = state.version;
    if(v === 1) $$('[data-v1-go]').forEach(b => b.dataset.v1Go === 'booking' && b.click());
    else if(v === 2) { const b = document.querySelector('[data-v2-go="booking"]'); b && b.click(); }
    else if(v === 3) { const b = document.querySelector('[data-v3-go="booking"]'); b && b.click(); }
    else if(v === 4) { const b = document.querySelector('[data-v4-go="booking"]'); b && b.click(); }
    return;
  }
  // إرسال طلب دباب
  const send = e.target.closest('[data-send]');
  if(send){
    toast('تم اختيار الدباب ✅', 'ok');
    const v = state.version;
    if(v === 1) $$('[data-v1-go]').forEach(b => b.dataset.v1Go === 'booking' && b.click());
    else if(v === 2) { const b = document.querySelector('[data-v2-go="booking"]'); b && b.click(); }
    else if(v === 3) { const b = document.querySelector('[data-v3-go="booking"]'); b && b.click(); }
    else if(v === 4) { const b = document.querySelector('[data-v4-go="booking"]'); b && b.click(); }
    return;
  }
  // تبديل حالة دباب
  const tog = e.target.closest('[data-toggle]');
  if(tog){
    const b = state.bikes.find(x => x.id === Number(tog.dataset.toggle));
    b.status = b.status === 'available' ? 'busy' : 'available';
    save.bikes();
    toast(`${b.name} → ${b.status === 'available' ? 'متاح' : 'مشغول'}`, 'ok');
    // أعد رسم التصميم الحالي
    renderVersion();
    return;
  }
  // بدء غسيل
  const st = e.target.closest('[data-start]');
  if(st){
    const o = state.orders.find(x => x.id === st.dataset.start);
    o.status = 'washing'; save.orders();
    toast('بدأ التنفيذ 🚿', 'ok');
    renderVersion();
    return;
  }
  // تم التسليم
  const dn = e.target.closest('[data-done]');
  if(dn){
    const o = state.orders.find(x => x.id === dn.dataset.done);
    o.status = 'done'; save.orders();
    toast('تم التسليم ✅', 'ok');
    renderVersion();
    return;
  }
  // نجوم التقييم
  const st2 = e.target.closest('[data-star]');
  if(st2){
    state.ratingValue = Number(st2.dataset.star);
    const box = st2.closest('[data-rating-box]');
    box.querySelectorAll('[data-star]').forEach(s => {
      const on = Number(s.dataset.star) <= state.ratingValue;
      s.style.color = on ? '#D4AF37' : '#D8E2EF';
      s.style.transform = on ? 'scale(1.1)' : 'scale(1)';
    });
    const labels = { 1:'ضعيف', 2:'مقبول', 3:'جيد', 4:'جيد جداً', 5:'ممتاز ⭐' };
    box.querySelector('[data-rating-label]').textContent = labels[state.ratingValue];
    return;
  }
});

// تقديم النماذج
document.addEventListener('submit', e => {
  const f = e.target;

  if(f.matches('[data-booking-form]')){
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f).entries());
    if(!d.name || !d.phone || !d.location || !d.car || !d.time){ toast('يرجى تعبئة الحقول', 'err'); return; }
    if(!/^0?5\d{8}$/.test(d.phone.replace(/\s|-/g,''))){ toast('رقم الجوال غير صحيح', 'err'); return; }
    const svc = SERVICES.find(s => s.id === d.service) || SERVICES[0];
    let bike = state.bikes.find(b => b.status === 'available') || state.bikes[0];
    const order = {
      id: uid('ORD'), code: uid('TW'),
      serviceId: svc.id, serviceName: svc.name, price: svc.price,
      name: d.name.trim(), phone: d.phone.trim(), location: d.location.trim(),
      car: d.car.trim(), time: d.time, bikeId: bike.id,
      status: 'paid', createdAt: todayStr()
    };
    state.orders.push(order); save.orders();
    const res = document.querySelector('[data-booking-result]');
    if(res) res.innerHTML = `
      <div style="background:#E6F7EF;color:#0B5C3E;border:1px solid #B7E7CE;border-radius:14px;padding:14px 18px;margin-bottom:18px;font-size:13.5px;line-height:1.7">
        <div style="font-size:16px;font-weight:900;margin-bottom:6px">✅ تم تأكيد حجزك!</div>
        <div>رقم الحجز: <b>${order.code}</b></div>
        <div>${esc(order.serviceName)} — ${money(order.price)}</div>
        <div>الموعد: <b>${order.time}</b> · ${esc(order.location)}</div>
        <div>الدباب: <b>${esc(bike.name)}</b></div>
        <a class="btn btn-wa btn-sm" style="margin-top:10px" target="_blank" rel="noopener" href="${WHATSAPP}?text=${encodeURIComponent('مرحباً، حجزي ' + order.code)}">📤 إرسال اللوكيشن واتساب</a>
      </div>`;
    f.reset();
    toast('تم تأكيد الحجز ✅', 'ok');
    return;
  }

  if(f.matches('[data-contact-form]')){
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f).entries());
    if(!d.name || !d.phone || !d.message){ toast('يرجى تعبئة الحقول', 'err'); return; }
    state.messages.push({ ...d, at: todayStr() }); save.messages();
    f.reset();
    toast('تم إرسال رسالتك ✅', 'ok');
    return;
  }

  if(f.matches('[data-rating-form]')){
    e.preventDefault();
    if(!state.ratingValue){ toast('اختر تقييمك', 'err'); return; }
    const d = Object.fromEntries(new FormData(f).entries());
    state.ratings.push({ value: state.ratingValue, name: d.name || 'عميل', note: d.note || '', at: todayStr() });
    save.ratings();
    const box = f.closest('[data-rating-box]');
    if(box) box.innerHTML = `
      <div style="text-align:center;padding:20px 10px">
        <div style="font-size:56px">🎉</div>
        <h3 style="font-size:22px;font-weight:900;color:#12855A;margin:8px 0">شكراً لك!</h3>
        <p style="color:#5B6B80">قيّمتنا بـ <b style="color:#D4AF37;font-size:20px">${state.ratingValue}/5</b></p>
      </div>`;
    toast('شكراً لتقييمك ⭐', 'ok');
    return;
  }
});

/* ================================================================
   البوت الذكي (مشترك لكل التصاميم)
   ================================================================ */
const BOT = {
  norm(s){
    return String(s).replace(/[\u064B-\u0652\u0670\u0640]/g,'')
      .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه')
      .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
  },
  intents: [
    { key:'sub', words:['اشتراك','شهري','شهريه'], reply:'📅 الاشتراك الشهري:\n4 غسلات بـ 80 ريال خلال الشهر — يشمل غسيل شامل.' },
    { key:'offer', words:['عرض','عروض','خصم','تخفيض','اوفر'], reply:'🔥 عرض الأسبوع:\nغسيل شامل بـ 35 ريال بدل 40.\n\n+ اشتراك شهري: 4 غسلات بـ 70.' },
    { key:'book', words:['احجز','حجز','موعد','كيف احجز'], reply:'📝 الحجز عبر الصفحة الرسمية.\nأو أرسل لنا: ' + OFFICIAL_PHONE },
    { key:'sendLoc', words:['ارسل الموقع','اللوكيشن','لوكيشن'], reply:'📍 أرسل اللوكيشن عبر واتساب:\n' + WHATSAPP },
    { key:'svc', words:['خدمات','خدمه','وش تسوون'], reply:'🚿 خدماتنا:\n• خارجي — 20\n• داخلي — 25\n• شامل — 40\n• اشتراك شهري — 80' },
    { key:'hours', words:['وقت','اوقات','متى','تفتحون'], reply:'🕓 أوقات العمل:\nمن 4 العصر إلى 11 الليل.' },
    { key:'loc', words:['موقع','وين انتم','مكان','احياء'], reply:'🏙️ نخدم جميع أحياء الرياض.' },
    { key:'contact', words:['تواصل','رقم','جوال','اتصال','واتساب'], reply:'📞 ' + OFFICIAL_PHONE + '\n\nواتساب:\n' + WHATSAPP },
    { key:'rate', words:['تقييم','قيم','راي','نجوم'], reply:'⭐ أرسل تقييمك من 1 إلى 5.' },
    { key:'price', words:['سعر','اسعار','كم','بكم','تكلفه'], reply:'💰 أسعارنا:\n• خارجي: 20\n• داخلي: 25\n• شامل: 40\n• اشتراك شهري: 80' },
    { key:'greet', words:['سلام','هلا','مرحبا','السلام','هاي','صباح','مساء'], reply:'وعليكم السلام 🌿\nأنا مساعد TurboWash. كيف أساعدك؟' }
  ],
  match(text){
    const n = this.norm(text);
    if(!n) return null;
    for(const it of this.intents){
      for(const w of it.words){ if(n.includes(this.norm(w))) return it; }
    }
    return null;
  },
  fallback(){ return 'ما فهمت سؤالك 🤔\nجرّب: الأسعار، الخدمات، العروض، الحجز، أوقات العمل.\nأو تواصل: ' + OFFICIAL_PHONE; }
};

const botPanel = $('#botPanel'), botMsgs = $('#botMsgs');
const QUICK = ['كم الأسعار؟','وش الخدمات؟','وش العروض؟','كيف أحجز؟','أوقات العمل'];

$('#botQuick').innerHTML = QUICK.map(q => `<button class="chip" data-q="${q}">${q}</button>`).join('');

function botPush(text, who='bot'){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  botMsgs.appendChild(el);
  botMsgs.scrollTop = botMsgs.scrollHeight;
}
function botTyping(on){
  let el = $('#botTyping');
  if(on){
    if(el) return;
    el = document.createElement('div');
    el.id = 'botTyping';
    el.className = 'msg bot typing';
    el.innerHTML = '<i></i><i></i><i></i>';
    botMsgs.appendChild(el);
    botMsgs.scrollTop = botMsgs.scrollHeight;
  } else if(el) el.remove();
}
async function botReply(text){
  const intent = BOT.match(text);
  botTyping(true);
  await new Promise(r => setTimeout(r, 450));
  botTyping(false);
  botPush(intent ? intent.reply : BOT.fallback(), 'bot');
}
function botOpen(){
  botPanel.classList.add('open');
  if(!botMsgs.dataset.init){
    botMsgs.dataset.init = '1';
    botPush('أهلًا وسهلًا 🌿\nأنا مساعد TurboWash. اسألني عن الأسعار، الخدمات، العروض، أو الحجز.', 'bot');
  }
  setTimeout(() => $('#botText').focus(), 220);
}
$('#botToggle').addEventListener('click', () => botPanel.classList.contains('open') ? botPanel.classList.remove('open') : botOpen());
$('#botClose').addEventListener('click', () => botPanel.classList.remove('open'));
$('#botQuick').addEventListener('click', e => {
  const c = e.target.closest('[data-q]');
  if(!c) return;
  botPush(c.dataset.q, 'user');
  botReply(c.dataset.q);
});
$('#botForm').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#botText').value.trim();
  if(!t) return;
  botPush(t, 'user');
  $('#botText').value = '';
  botReply(t);
});

/* ================================================================
   الإقلاع
   ================================================================ */
renderVersion();
</script>
